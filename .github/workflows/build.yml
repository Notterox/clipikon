# Builds and tests every push to main. A pushed tag like v0.1.0 also creates a GitHub release with the zip.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "clipikon-$env:GITHUB_REF_NAME-windows-x64" -replace '/', '-'
          New-Item -ItemType Directory -Path "$name/licenses" | Out-Null
          Copy-Item target/release/clipikon.exe, LICENSE, README.md $name
          Copy-Item ffmpeg-build/out/FFmpeg-LICENSE.txt "$name/licenses/"
          Copy-Item licenses/LGPL-3.0.txt "$name/licenses/FSRCNNX-LGPL-3.0.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "NAME=$name" >> $env:GITHUB_ENV
          "ZIP=$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME $env:ZIP --title "Clipikon $env:GITHUB_REF_NAME" --generate-notes
