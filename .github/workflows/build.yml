# Builds and tests every push and pull request. On main, when Cargo.toml's version has no release yet, it also
# creates the GitHub release v<version> with the zip and the installer: bump the version and push to publish.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "clipikon-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Path "$name/licenses" | Out-Null
          Copy-Item target/release/clipikon.exe, LICENSE, README.md $name
          Copy-Item ffmpeg-build/out/FFmpeg-LICENSE.txt "$name/licenses/"
          Copy-Item licenses/LGPL-3.0.txt "$name/licenses/FSRCNNX-LGPL-3.0.txt"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "NAME=$name" >> $env:GITHUB_ENV
          "ZIP=$name.zip" >> $env:GITHUB_ENV

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=$env:VERSION" installer\clipikon.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SETUP=target/installer/Clipikon-Setup-$env:VERSION.exe" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}
            ${{ env.SETUP }}

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag already exists; bump the version in Cargo.toml to publish a new one."
            exit 0
          }
          gh release create $tag $env:ZIP $env:SETUP --target $env:GITHUB_SHA --title "Clipikon $tag" --generate-notes
