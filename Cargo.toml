[package]
name = "clipikon"
version = "0.1.1"
edition = "2024"
license = "MIT"
description = "Screen region recorder for Windows with NVENC, plus a trim and export editor"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
hound = "3.5.1"
png = "0.17"
raw-window-handle = "0.6"
regex = "1.13.1"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Networking_WinHttp",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "UI",
    "UI_ViewManagement",
] }

[build-dependencies]
embed-resource = "3"
png = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
